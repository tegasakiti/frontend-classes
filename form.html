<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML FORMS</title>
</head>

<body>
    <h1>Hello World!</h1>
    <form method="post">
        <label for="name">Full Name:</label>
        <input type="text" id="name" placeholder="Enter your name"><br><br>
        <label for="email">Email Address:</label>
        <input type="email" id="email" placeholder="Enter your email address"><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Enter your password" /><br><br>
        <label for="message">Message:</label><br><br>
        <textarea name="message" id="message" cols="30" rows="10" placeholder="Enter your message"></textarea><br><br>
        <label for="country">Country:</label><br><br>
        <select name="country" id="country">
            <option value="tega">United States</option>
            <option value="ca">Canada</option>
            <option value="uk">United Kingdom</option>
            <option value="ng">Nigeria</option>
        </select><br><br>
        <input type="submit" value="Submit">
    </form>
</body>

</html>
