<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML TABLE</title>
</head>
<body>
    <table border="1" cellpadding="10" cellspacing="6">
        <tr>
            <th>S/N</th>
            <th>Full Name</th>
            <th>Email Address</th>
            <th>Password</th>
            <th>Message</th>
            <th>Country</th>
        </tr>
        <tr>
            <td>1</td>
            <td>John Doe</td>
            <td>john.doe@example.com</td>
            <td>password123</td>
            <td>Hello, this is a test message.</td>
            <td>United States</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Jane Smith</td>
            <td>jane.smith@example.com</td>
            <td>password456</td>
            <td>Hi there!</td>
            <td>Canada</td>
        </tr>
    </table>
</body>
</html>
